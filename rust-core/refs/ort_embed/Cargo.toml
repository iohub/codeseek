[package]
name = "rembed"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Local ONNX text-embedding inference CLI (harrier-oss-v1-0.6b-ONNX, Qwen3-based embedding model)"

[dependencies]
# ONNX Runtime 的 Rust 封装。默认 features 已含 download-binaries + ndarray + api-31。
# `half` feature 用于直接从 fp16 输出张量里抽数据。
# 若目标机器无法下载 onnxruntime 预编译库，可用 ORT_DYLIB_PATH 指向本地 libonnxruntime.dylib。
ort = { version = "2.0.0-rc.15", features = ["half"] }
# HuggingFace tokenizers，用来加载 tokenizer.json（BPE）
tokenizers = { version = "0.23", default-features = false, features = ["onig", "fancy-regex"] }
# 张量容器（版本需与 ort 内部使用的 ndarray 一致）
ndarray = "0.17"
# 错误传播
anyhow = "1"
# fp16 <-> f32 转换
half = "2"
# 命令行解析（derive 模式即可覆盖原有 7 个参数）
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
